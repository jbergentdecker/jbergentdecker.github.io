<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="i18n-namespaces" content="ui,tours" />
    <meta name="locales-path" content="../assets/locales" />
    <meta name="components-path" content="../assets/components" />

    
    <title>Tours</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="css/tours.css" />
</head>

<body>

    <!-- ── Navigation (injected by navbar.js) ── -->
    <div id="navbar-placeholder"></div>

    <!-- Header -->
    <header class="tours-header">
        <h1 data-i18n="tours:header.title">Our Tours</h1>
        <p data-i18n="tours:header.subtitle">Explore our mountain adventures</p>
    </header>

    <!-- Filter bar -->
    <section class="tours-filters">
        <button class="filter-btn active" data-filter="all" data-i18n="tours:filters.all">All</button>
        <button class="filter-btn" data-filter="hiking" data-i18n="tours:filters.hiking">Hiking</button>
        <button class="filter-btn" data-filter="mountaineering"
            data-i18n="tours:filters.mountaineering">Mountaineering</button>
        <button class="filter-btn" data-filter="climbing" data-i18n="tours:filters.climbing">Climbing</button>
        <button class="filter-btn" data-filter="skitouring" data-i18n="tours:filters.skitouring">Ski Touring</button>
        <button class="filter-btn" data-filter="snowshoeing" data-i18n="tours:filters.snowshoeing">Snowshoeing</button>
        <button class="filter-btn" data-filter="trailrunning" data-i18n="tours:filters.trailrunning">Trail Running</button>
        <button class="filter-btn" data-filter="cycling" data-i18n="tours:filters.cycling">Cycling</button>
    </section>

    <!-- ── Tour cards (injected by tours.js) ── -->
    <main class="tours-grid" id="tours-grid"></main>

    <!-- ── Footer (injected by footer.js) ── -->
    <div id="footer-placeholder"></div>

    <script src="../assets/js/i18n.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="js/tours.js"></script>
    <script src="../assets/js/footer.js"></script>
    <script src="../assets/js/navbar.js"></script>

</body>

</html>
